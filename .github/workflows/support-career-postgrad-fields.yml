name: Support Carrera and Postgrado fields

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/support-career-postgrad-fields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Carrera/Postgrado compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if "profesion: item.profesion || item.carrera || 'General'" not in text:
              pattern = re.compile(r"(?m)^(?P<i>\s*)profesion:\s*item\.profesion\s*\|\|\s*'General',\s*$")
              def repl(m):
                  i = m.group('i')
                  return (
                      f"{i}// Compatibilidad académica con el registro actual\n"
                      f"{i}profesion: item.profesion || item.carrera || 'General',\n"
                      f"{i}carrera: item.carrera || item.profesion || '',\n"
                      f"{i}postgrado: item.postgrado || '',"
                  )
              text, n = pattern.subn(repl, text, count=1)
              if n != 1:
                  raise SystemExit('No se encontró la línea de normalización de profesión')

          if "item.postgrado && item.postgrado.toLowerCase().includes(term)" not in text:
              pattern = re.compile(
                  r"(?m)^(?P<i>\s*)\(item\.profesion\s*&&\s*item\.profesion\.toLowerCase\(\)\.includes\(term\)\);\s*$"
              )
              def repl_search(m):
                  i = m.group('i')
                  return (
                      f"{i}(item.profesion && item.profesion.toLowerCase().includes(term)) ||\n"
                      f"{i}(item.carrera && item.carrera.toLowerCase().includes(term)) ||\n"
                      f"{i}(item.postgrado && item.postgrado.toLowerCase().includes(term));"
                  )
              text, n = pattern.subn(repl_search, text, count=1)
              if n != 1:
                  raise SystemExit('No se encontró la línea de búsqueda por profesión')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch
        run: |
          set -euxo pipefail
          grep -F "profesion: item.profesion || item.carrera || 'General'" index.html
          grep -F "carrera: item.carrera || item.profesion || ''" index.html
          grep -F "postgrado: item.postgrado || ''" index.html
          grep -F "item.postgrado && item.postgrado.toLowerCase().includes(term)" index.html

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Support Carrera and Postgrado fields in directory'
          git push origin main
