name: Add corporate offer entry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate corporate offer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_bytes().decode('utf-8')
          nl = '\r\n' if '\r\n' in text else '\n'
          if 'https://presupuesto.movidasst.com/' not in text:
              anchor = '        <div class="max-w-7xl mx-auto pb-20"> '
              if anchor not in text:
                  anchor = '        <div class="max-w-7xl mx-auto pb-20">'
              if anchor not in text: raise SystemExit('No se encontró contenedor principal')
              lines = [
                  '',
                  '            <!-- Oferta corporativa -->',
                  '            <a href="https://presupuesto.movidasst.com/" class="mb-5 mt-2 md:mt-4 group block overflow-hidden rounded-2xl border border-cyan-200/70 bg-gradient-to-r from-[#00205b] via-[#004e78] to-[#007b85] p-[1px] shadow-[0_12px_30px_rgba(0,32,91,.12)] transition hover:-translate-y-0.5 hover:shadow-[0_18px_36px_rgba(0,32,91,.16)]">',
                  '                <div class="flex flex-col gap-3 rounded-[15px] bg-white/95 px-4 py-3.5 sm:flex-row sm:items-center sm:justify-between sm:px-5">',
                  '                    <div class="flex items-center gap-3 min-w-0">',
                  '                        <div class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-[#007b85] to-[#00205b] text-white shadow-lg shadow-cyan-900/10">',
                  '                            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M6 21V7l6-4 6 4v14"/><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M9 14h.01"/><path d="M15 14h.01"/></svg>',
                  '                        </div>',
                  '                        <div class="min-w-0">',
                  '                            <div class="text-[10px] font-black uppercase tracking-[.16em] text-[#007b85]">¿Representas una empresa?</div>',
                  '                            <div class="mt-0.5 text-sm font-black text-[#00205b] sm:text-base">Capacitación corporativa en SST para tu equipo</div>',
                  '                            <p class="mt-0.5 text-xs font-medium text-slate-500">Cotiza participantes y cursos, solicita propuesta y gestiona el seguimiento de la formación.</p>',
                  '                        </div>',
                  '                    </div>',
                  '                    <span class="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl bg-[#f8c300] px-4 py-2.5 text-xs font-black text-[#00205b] shadow-sm transition group-hover:bg-[#ffd43b]">Cotizar plan corporativo <span aria-hidden="true">→</span></span>',
                  '                </div>',
                  '            </a>'
              ]
              text = text.replace(anchor, anchor + nl.join(lines), 1)
              path.write_bytes(text.encode('utf-8'))
          PY
      - name: Verify integration
        run: |
          grep -q 'https://presupuesto.movidasst.com/' index.html
          grep -q 'Capacitación corporativa en SST para tu equipo' index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add corporate training entry"
          git push
